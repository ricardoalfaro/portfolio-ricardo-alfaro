<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Nueva nota</title>
    <link rel="stylesheet" href="/publicaciones/notas/blog.css">
  </head>
  <body>
    <main class="blog-shell editor-shell">
      <header class="blog-header compact">
        <p class="eyebrow">Archivo.</p>
        <h1>Publicar una nota</h1>
      </header>
      <section class="auth-panel" aria-labelledby="publish-title">
        <h2 id="publish-title">Desde Google Docs</h2>
        <p>Crea o mueve un Documento de Google a la carpeta <strong>Blog publicado</strong>. El título del documento será el título de la nota y el cuerpo se actualizará cada vez que edites el Doc.</p>
        <p><a href="https://drive.google.com/drive/folders/1euKClYEJkU3Ya2pxvmwsmniaTJK-cCrm" target="_blank" rel="noopener">Abrir carpeta Blog publicado →</a></p>
      </section>
    </main>
  </body>
